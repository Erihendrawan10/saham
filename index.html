<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking Kinerja Saham</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#EEF0EA;
    --card:#FBFAF7;
    --ink:#182620;
    --ink-muted:#5C6B62;
    --border:#D9DCD1;
    --primary:#1F3D34;
    --gain:#3F7D58;
    --loss:#B3492F;
    --gain-bg:#E4EEE7;
    --loss-bg:#F5E5DF;
    --accent2:#9A8148;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
  .masthead{text-align:center;}
  .masthead h1{font-family:'Source Serif 4',serif;font-weight:600;font-size:24px;margin:0;color:var(--primary);}

  .tabs{display:flex;border-bottom:1px solid var(--border);margin:16px 0 18px;gap:4px;}
  .tab{flex:1;text-align:center;padding:10px 4px;font-size:13.5px;font-weight:600;color:var(--ink-muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--primary);border-bottom:2px solid var(--primary);}
  .view{display:none;}
  .view.active{display:block;}

  .hero{background:var(--primary);color:#F4F5F0;border-radius:4px;padding:20px 18px;margin-bottom:14px;}
  .hero .label{font-size:12px;opacity:.75;margin:0 0 4px;}
  .hero .value{font-family:'Source Serif 4',serif;font-size:30px;font-weight:600;margin:0;line-height:1.15;}
  .hero .sub{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(244,245,240,.18);flex-wrap:wrap;}
  .hero .sub div{flex:1;min-width:100px;}
  .hero .sub .k{font-size:11px;opacity:.7;margin:0 0 2px;}
  .hero .sub .v{font-size:15px;font-weight:600;margin:0;font-family:'Source Serif 4',serif;}

  .cagr-grid{display:flex;gap:10px;margin-bottom:14px;}
  .cagr-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:12px 10px;text-align:center;}
  .cagr-box .t{font-size:10.5px;color:var(--ink-muted);margin:0 0 6px;line-height:1.3;}
  .cagr-box .n{font-family:'Source Serif 4',serif;font-size:18px;font-weight:600;margin:0;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:14px;}
  .card h2{font-family:'Source Serif 4',serif;font-size:16px;font-weight:600;margin:0 0 4px;color:var(--primary);}
  .card .desc{font-size:12px;color:var(--ink-muted);margin:0 0 12px;}

  .chart-wrap svg{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:16px;margin-top:8px;font-size:11.5px;color:var(--ink-muted);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .row-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .row-item:last-child{border-bottom:none;}
  .row-item .m{font-weight:600;}
  .row-item .meta{font-size:11.5px;color:var(--ink-muted);}
  .pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;display:inline-block;}
  .pill.gain{background:var(--gain-bg);color:var(--gain);}
  .pill.loss{background:var(--loss-bg);color:var(--loss);}

  form{display:flex;flex-direction:column;gap:10px;}
  .field label{font-size:12px;color:var(--ink-muted);display:block;margin-bottom:4px;}
  .field input, .field select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:4px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);}
  .field input:focus, .field select:focus{outline:none;border-color:var(--primary);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  button.primary{background:var(--primary);color:#F4F5F0;border:none;padding:11px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;}
  button.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);padding:9px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-row{display:flex;gap:8px;}
  .btn-row button, .btn-row label{flex:1;}
  .delete-btn{background:none;border:none;color:var(--loss);font-size:11.5px;cursor:pointer;padding:0;text-decoration:underline;}
  .edit-btn{background:none;border:none;color:var(--primary);font-size:11.5px;cursor:pointer;padding:0;text-decoration:underline;margin-right:10px;}
  .empty{text-align:center;color:var(--ink-muted);font-size:13px;padding:24px 8px;}

  table.data-table{width:100%;border-collapse:collapse;font-size:12px;}
  table.data-table th{text-align:right;font-weight:600;color:var(--ink-muted);font-size:10.5px;padding:6px 4px;border-bottom:1px solid var(--border);}
  table.data-table th:first-child, table.data-table td:first-child{text-align:left;}
  table.data-table td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--border);}
  table.data-table tr:last-child td{border-bottom:none;}
  .scroll-x{overflow-x:auto;}

  .filebtn{display:inline-block;text-align:center;}
  input[type=file]{display:none;}
  .year-filter{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .year-filter label{font-size:12.5px;color:var(--ink-muted);font-weight:600;}
  .year-filter select{flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:4px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);}
  .compare-grid{display:flex;gap:0;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
  .compare-col{flex:1;padding:12px;}
  .compare-col:first-child{border-right:1px solid var(--border);background:var(--gain-bg);}
  .compare-col .yr{font-size:11px;color:var(--ink-muted);margin:0 0 8px;font-weight:600;}
  .compare-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .compare-row .k{color:var(--ink-muted);}
  .compare-row .v{font-weight:600;}
  .note{font-size:11px;color:var(--ink-muted);margin-top:8px;line-height:1.5;}

  .sync-card{background:#E4EEE7;border:1px solid #B8D6C3;padding:12px;border-radius:4px;margin-bottom:12px;}
  .sync-card .val{font-size:16px;font-weight:700;color:var(--primary);margin-top:4px;}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <h1>Tracking Kinerja Saham</h1>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="ringkasan">Ringkasan</button>
    <button class="tab" data-tab="data">Portofolio</button>
    <button class="tab" data-tab="watchlist">Watchlist</button>
    <button class="tab" data-tab="pengaturan">Pengaturan</button>
  </div>

  <div id="view-ringkasan" class="view active"></div>
  <div id="view-data" class="view"></div>
  <div id="view-watchlist" class="view"></div>
  <div id="view-pengaturan" class="view"></div>

  <div id="app-version" style="text-align:center;font-size:11px;color:var(--ink-muted);margin-top:24px;opacity:.7;">Tracking Saham 1.1 (Synced)</div>
</div>

<script>
let rows = [];         // {id, date, dana, dividen, equity, ihsg}
let watchlist = [];    // {id, kode, nama, eps, peMean, price, hargaWajar, mos, status, action, updatedAt}
let transactions = []; // {id, date, type:'BELI'|'JUAL', kode, lembar, harga, total, catatan}

let editingId = null;
let editingWatchId = null;
let editingTxId = null;
let loaded = false;
let yearFilter = 'all';

const fmtRp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const fmtPct = n => (n===null||n===undefined||isNaN(n)) ? '—' : (n>=0?'+':'') + (n*100).toFixed(2) + '%';
const fmtDate = s => { const d = new Date(s+'T00:00:00'); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtMonth = s => { const d = new Date(s+'T00:00:00'); return d.toLocaleDateString('id-ID',{month:'long',year:'numeric'}); };

const DEFAULT_SCRIPT_URL = '';
function getScriptUrl(){ return (DEFAULT_SCRIPT_URL || '').trim() || (localStorage.getItem('apps-script-url') || '').trim(); }
function setScriptUrl(url){ localStorage.setItem('apps-script-url', url.trim()); }
let syncStatus = { connected: !!getScriptUrl(), state:'idle', message:'' };

function toApiPortfolioRow(r){ return { id:r.id, tanggal:r.date, dana:r.dana, dividen:r.dividen||0, equity:r.equity, ihsg:r.ihsg }; }
function fromApiPortfolioRow(r){ return { id:String(r.id), date:String(r.tanggal), dana:Number(r.dana)||0, dividen:Number(r.dividen)||0, equity:Number(r.equity)||0, ihsg:Number(r.ihsg)||0 }; }
function fromApiWatchlistRow(r){
  return {
    id:String(r.id), kode:String(r.kode||'').toUpperCase(), nama:r.nama||'',
    eps:Number(r.eps)||0, peMean:Number(r.peMean)||0, price:Number(r.price)||0,
    hargaWajar:Number(r.hargaWajar)||0, mos:Number(r.mos)||0,
    status:r.status||'', action:r.action||'', updatedAt:r.updatedAt||''
  };
}
function toApiTransactionRow(t){ return { id:t.id, tanggal:t.date, tipe:t.type, kode:t.kode, lembar:t.lembar, harga:t.harga, total:t.total, catatan:t.catatan||'' }; }
function fromApiTransactionRow(t){
  return {
    id:String(t.id), date:String(t.tanggal), type:String(t.tipe), kode:String(t.kode||'').toUpperCase(),
    lembar:Number(t.lembar)||0, harga:Number(t.harga)||0, total:Number(t.total)||0, catatan:t.catatan||''
  };
}

async function loadData(){
  const url = getScriptUrl();
  if(url){
    syncStatus = {connected:true, state:'loading', message:'Memuat data…'};
    renderSyncStatus();
    try{
      const res = await fetch(url);
      const json = await res.json();
      if(json.ok){
        rows = (json.portfolio||[]).map(fromApiPortfolioRow);
        watchlist = (json.watchlist||[]).map(fromApiWatchlistRow);
        transactions = (json.transactions||[]).map(fromApiTransactionRow);

        localStorage.setItem('nav-tracker-data-cache', JSON.stringify(rows));
        localStorage.setItem('watchlist-cache', JSON.stringify(watchlist));
        localStorage.setItem('transactions-cache', JSON.stringify(transactions));
        syncStatus = {connected:true, state:'idle', message:'Tersambung ke Google Sheets.'};
      }
    }catch(e){
      rows = JSON.parse(localStorage.getItem('nav-tracker-data-cache') || '[]');
      watchlist = JSON.parse(localStorage.getItem('watchlist-cache') || '[]');
      transactions = JSON.parse(localStorage.getItem('transactions-cache') || '[]');
    }
  } else {
    rows = JSON.parse(localStorage.getItem('nav-tracker-data') || '[]');
    watchlist = JSON.parse(localStorage.getItem('watchlist-data') || '[]');
    transactions = JSON.parse(localStorage.getItem('transactions-data') || '[]');
  }
  loaded = true;
  renderAll();
}

async function saveData(){
  localStorage.setItem('nav-tracker-data-cache', JSON.stringify(rows));
  const url = getScriptUrl();
  if(url){
    try{
      await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'savePortfolio', rows: rows.map(toApiPortfolioRow)})
      });
    }catch(e){}
  } else { localStorage.setItem('nav-tracker-data', JSON.stringify(rows)); }
}

async function saveTransactions(){
  localStorage.setItem('transactions-cache', JSON.stringify(transactions));
  const url = getScriptUrl();
  if(url){
    try{
      await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'saveTransactions', rows: transactions.map(toApiTransactionRow)})
      });
    }catch(e){}
  } else { localStorage.setItem('transactions-data', JSON.stringify(transactions)); }
}

// ---------- LOGIKA SINKRONISASI EQUITY & KAS ----------
function computeHoldings(){
  const sorted = [...transactions].sort((a,b)=> a.date.localeCompare(b.date));
  const holdings = {};

  sorted.forEach(t=>{
    const k = t.kode.toUpperCase();
    if(!holdings[k]) holdings[k] = { lembar: 0, totalCost: 0 };

    if(t.type === 'BELI'){
      holdings[k].lembar += t.lembar;
      holdings[k].totalCost += t.total;
    } else if(t.type === 'JUAL'){
      if(holdings[k].lembar > 0){
        const avg = holdings[k].totalCost / holdings[k].lembar;
        holdings[k].lembar = Math.max(0, holdings[k].lembar - t.lembar);
        holdings[k].totalCost = holdings[k].lembar * avg;
      }
    }
  });

  return Object.keys(holdings)
    .filter(k => holdings[k].lembar > 0)
    .map(k => {
      const h = holdings[k];
      const avgPrice = h.lembar > 0 ? h.totalCost / h.lembar : 0;
      const w = watchlist.find(x => x.kode === k);
      const currPrice = w ? w.price : avgPrice;
      const marketVal = h.lembar * currPrice;
      const floatingPL = marketVal - h.totalCost;
      const floatingPct = h.totalCost > 0 ? floatingPL / h.totalCost : 0;

      return { kode: k, lembar: h.lembar, lot: h.lembar / 100, avgPrice, totalCost: h.totalCost, currPrice, marketVal, floatingPL, floatingPct };
    });
}

function computeSyncedSummary(){
  const totalDana = rows.reduce((a,r)=> a + r.dana, 0);
  const totalDividen = rows.reduce((a,r)=> a + (r.dividen||0), 0);
  
  let netBeli = 0;
  transactions.forEach(t=>{
    if(t.type === 'BELI') netBeli += t.total;
    if(t.type === 'JUAL') netBeli -= t.total;
  });

  const currentCash = totalDana + totalDividen - netBeli;
  const holdings = computeHoldings();
  const totalMarketVal = holdings.reduce((a,h)=> a + h.marketVal, 0);
  const totalEquity = currentCash + totalMarketVal;

  return { currentCash, totalMarketVal, totalEquity, totalDana, totalDividen };
}

// ---------- MESIN NAB & PERHITUNGAN ----------
function compute(){
  const sorted = [...rows].sort((a,b)=> a.date.localeCompare(b.date));
  let unitPrev = 0, nabPrev = 1000, ihsgPrev = null;
  const out = [];
  sorted.forEach((r,i)=>{
    const dana = Number(r.dana)||0;
    const dividen = Number(r.dividen)||0;
    const equity = Number(r.equity)||0;
    const ihsg = Number(r.ihsg)||0;
    const baseNab = i===0 ? 1000 : nabPrev;
    const newUnit = baseNab>0 ? dana/baseNab : 0;
    const totalUnit = unitPrev + newUnit;
    const nab = totalUnit>0 ? equity/totalUnit : 1000;
    const nabPct = i===0 ? null : (nabPrev>0 ? nab/nabPrev-1 : null);
    const ihsgPct = i===0 ? null : (ihsgPrev>0 ? ihsg/ihsgPrev-1 : null);
    out.push({...r, dana, dividen, equity, ihsg, newUnit, totalUnit, nab, nabPct, ihsgPct});
    unitPrev = totalUnit; nabPrev = nab; ihsgPrev = ihsg;
  });
  return out;
}

function xirr(cashflows){
  if(cashflows.length < 2) return null;
  const hasPos = cashflows.some(c=>c.amount>0);
  const hasNeg = cashflows.some(c=>c.amount<0);
  if(!hasPos || !hasNeg) return null;
  const d0 = cashflows[0].date;
  const yrs = d => (d - d0)/(365*86400000);
  let rate = 0.15;
  for(let iter=0; iter<200; iter++){
    let f=0, df=0;
    for(const cf of cashflows){
      const t = yrs(cf.date);
      const denom = Math.pow(1+rate, t);
      f += cf.amount/denom;
      df += -t*cf.amount/Math.pow(1+rate, t+1);
    }
    if(Math.abs(df) < 1e-10) break;
    const next = rate - f/df;
    if(!isFinite(next)) return null;
    if(Math.abs(next-rate) < 1e-8){ rate = next; break; }
    rate = Math.max(-0.99, next);
  }
  return isFinite(rate) ? rate : null;
}

function computeCAGR(computed){
  if(computed.length < 2) return {equity:null, nab:null, ihsg:null};
  const first = computed[0], last = computed[computed.length-1];
  const days = (new Date(last.date+'T00:00:00') - new Date(first.date+'T00:00:00'))/86400000;
  let nabCAGR = null, ihsgCAGR = null;
  if(days > 0){
    nabCAGR = Math.pow(last.nab/1000, 365/days) - 1;
    if(first.ihsg > 0) ihsgCAGR = Math.pow(last.ihsg/first.ihsg, 365/days) - 1;
  }
  const cashflows = computed.map((r,i)=>{
    let amt = -r.dana;
    if(i===computed.length-1) amt += r.equity;
    return {date:new Date(r.date+'T00:00:00'), amount:amt};
  });
  return {equity:xirr(cashflows), nab:nabCAGR, ihsg:ihsgCAGR};
}

// ---------- RENDER VIEWS ----------
function renderRingkasan(){
  const el = document.getElementById('view-ringkasan');
  const computed = compute();
  const summary = computeSyncedSummary();

  if(computed.length===0){
    el.innerHTML = `<div class="card"><div class="empty">Belum ada data.<br>Tambahkan setoran awal di tab "Portofolio".</div></div>`;
    return;
  }
  const last = computed[computed.length-1];
  const totalReturn = last.nab/1000 - 1;
  const cagr = computeCAGR(computed);

  el.innerHTML = `
    <div class="hero">
      <p class="label">Nilai Portofolio (NAB Terakhir)</p>
      <p class="value">${fmtRp(last.equity)}</p>
      <div class="sub">
        <div><p class="k">NAB saat ini</p><p class="v">${fmtRp(last.nab)}</p></div>
        <div><p class="k">Return kumulatif</p><p class="v" style="color:${totalReturn>=0?'#8FD1AC':'#F0AF97'}">${fmtPct(totalReturn)}</p></div>
        <div><p class="k">Per ${fmtDate(last.date)}</p><p class="v">${computed.length} entri</p></div>
      </div>
    </div>

    <div class="sync-card">
      <div style="font-size:12px;color:var(--primary);font-weight:600;">ESTIMASI EQUITY SINKRON (SISA KAS + VALUASI SAHAM):</div>
      <div class="val">${fmtRp(summary.totalEquity)}</div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:4px;">
        Sisa Kas: <strong>${fmtRp(summary.currentCash)}</strong> &bull; Saham: <strong>${fmtRp(summary.totalMarketVal)}</strong>
      </div>
    </div>

    <div class="cagr-grid">
      <div class="cagr-box">
        <p class="t">CAGR Equity</p>
        <p class="n" style="color:${cagr.equity===null?'var(--ink-muted)':(cagr.equity>=0?'var(--gain)':'var(--loss)')}">${cagr.equity===null?'—':fmtPct(cagr.equity)}</p>
      </div>
      <div class="cagr-box">
        <p class="t">CAGR NAB</p>
        <p class="n" style="color:${cagr.nab===null?'var(--ink-muted)':(cagr.nab>=0?'var(--gain)':'var(--loss)')}">${cagr.nab===null?'—':fmtPct(cagr.nab)}</p>
      </div>
      <div class="cagr-box">
        <p class="t">CAGR IHSG</p>
        <p class="n" style="color:${cagr.ihsg===null?'var(--ink-muted)':(cagr.ihsg>=0?'var(--gain)':'var(--loss)')}">${cagr.ihsg===null?'—':fmtPct(cagr.ihsg)}</p>
      </div>
    </div>

    <div class="card">
      <h2>NAB vs IHSG (rebased ke 1000)</h2>
      ${computed.length>=2 ? `
        <div class="chart-wrap">${buildChart(computed)}</div>
      ` : `<div class="empty">Tambahkan minimal 2 entri untuk melihat grafik.</div>`}
    </div>
  `;
}

function buildChart(computed){
  const w = 500, h = 170, padL = 34, padR = 8, padT = 10, padB = 22;
  const cw = w - padL - padR, ch = h - padT - padB;
  const ihsg0 = computed[0].ihsg || 1;
  const points = computed.map(r=>({date:r.date, nab:r.nab, ihsgIdx: (r.ihsg/ihsg0)*1000}));
  const maxY = Math.max(...points.map(p=>Math.max(p.nab,p.ihsgIdx)), 1000);
  const minY = Math.min(...points.map(p=>Math.min(p.nab,p.ihsgIdx)), 1000);
  const range = (maxY-minY) || 1;

  const x = i => padL + (points.length===1 ? cw/2 : (i/(points.length-1))*cw);
  const y = v => padT + ch - ((v-minY)/range)*ch;

  const linePath = key => points.map((p,i)=> (i===0?'M':'L') + x(i).toFixed(1) + ',' + y(p[key]).toFixed(1)).join(' ');

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <path d="${linePath('ihsgIdx')}" fill="none" stroke="#9A8148" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="${linePath('nab')}" fill="none" stroke="#1F3D34" stroke-width="2.5"/>
  </svg>`;
}

function renderData(){
  const el = document.getElementById('view-data');
  const computed = compute();
  const holdings = computeHoldings();
  const summary = computeSyncedSummary();
  const editing = editingId ? rows.find(r=>r.id===editingId) : null;
  const editingTx = editingTxId ? transactions.find(t=>t.id===editingTxId) : null;

  el.innerHTML = `
    <div class="card">
      <h2>${editingTx ? 'Ubah Transaksi' : 'Transaksi Beli / Jual Saham'}</h2>
      <form id="form-transaction">
        <div class="field-row">
          <div class="field">
            <label>Aksi</label>
            <select id="t-type">
              <option value="BELI" ${editingTx && editingTx.type==='BELI'?'selected':''}>BELI</option>
              <option value="JUAL" ${editingTx && editingTx.type==='JUAL'?'selected':''}>JUAL</option>
            </select>
          </div>
          <div class="field">
            <label>Kode Saham</label>
            <input type="text" id="t-kode" placeholder="BBCA" value="${editingTx?editingTx.kode:''}" style="text-transform:uppercase;" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Tanggal</label>
            <input type="date" id="t-date" value="${editingTx?editingTx.date:''}" required>
          </div>
          <div class="field">
            <label>Jumlah (Lot)</label>
            <input type="number" id="t-lot" placeholder="10" min="0.01" step="any" value="${editingTx?(editingTx.lembar/100):''}" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Harga per Lembar (Rp)</label>
            <input type="number" id="t-harga" placeholder="8500" min="1" value="${editingTx?editingTx.harga:''}" required>
          </div>
          <div class="field">
            <label>Total Transaksi (Rp)</label>
            <input type="number" id="t-total" readonly style="background:#eef0ea;">
          </div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">${editingTx?'Simpan':'Catat Transaksi'}</button>
          ${editingTx?'<button type="button" class="secondary" id="cancel-tx-edit">Batal</button>':''}
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Kepemilikan Saham &amp; Kas</h2>
      <p class="desc">Estimasi Kas: <strong>${fmtRp(summary.currentCash)}</strong> | Nilai Pasar Saham: <strong>${fmtRp(summary.totalMarketVal)}</strong></p>
      ${holdings.length ? `
      <div class="scroll-x">
      <table class="data-table">
        <thead>
          <tr><th>Kode</th><th>Lot</th><th>Avg Price</th><th>Harga Saat Ini</th><th>Nilai Pasar</th><th>Unrealized P/L</th></tr>
        </thead>
        <tbody>
        ${holdings.map(h=>`
          <tr>
            <td><strong>${h.kode}</strong></td>
            <td>${h.lot.toLocaleString('id-ID')}</td>
            <td>${fmtRp(h.avgPrice)}</td>
            <td>${fmtRp(h.currPrice)}</td>
            <td>${fmtRp(h.marketVal)}</td>
            <td style="color:${h.floatingPL>=0?'var(--gain)':'var(--loss)'}">${fmtRp(h.floatingPL)}</td>
          </tr>
        `).join('')}
        </tbody>
      </table>
      </div>
      ` : `<div class="empty">Belum ada posisi saham aktif.</div>`}
    </div>

    <div class="card">
      <h2>${editing ? 'Ubah Entri NAB' : 'Tambah Entri NAB Bulanan'}</h2>
      <form id="form-entry">
        <div class="field">
          <label>Tanggal</label>
          <input type="date" id="f-date" value="${editing?editing.date:''}" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Dana Masuk/Keluar (Rp)</label>
            <input type="number" id="f-dana" value="${editing?editing.dana:'0'}" required>
          </div>
          <div class="field">
            <label>Equity Aktual (Rp)</label>
            <input type="number" id="f-equity" value="${editing?editing.equity:''}" required>
          </div>
        </div>
        <button type="button" class="secondary" id="btn-use-synced-equity" style="margin-bottom:8px;width:100%;">
          ⚡ Gunakan Hasil Sinkronasi Saham (${fmtRp(summary.totalEquity)})
        </button>
        <div class="field-row">
          <div class="field">
            <label>Dividen Diterima (Rp)</label>
            <input type="number" id="f-dividen" value="${editing?(editing.dividen||0):'0'}">
          </div>
          <div class="field">
            <label>IHSG</label>
            <input type="number" id="f-ihsg" step="0.01" value="${editing?editing.ihsg:''}" required>
          </div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">${editing?'Simpan':'Tambah Entri'}</button>
          ${editing?'<button type="button" class="secondary" id="cancel-edit">Batal</button>':''}
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Riwayat NAB</h2>
      ${computed.length ? `
      <div class="scroll-x">
      <table class="data-table">
        <thead><tr><th>Tanggal</th><th>Dana</th><th>Dividen</th><th>Equity</th><th>NAB</th><th>NAB%</th><th>IHSG</th><th></th></tr></thead>
        <tbody>
        ${[...computed].reverse().map(r=>`
          <tr>
            <td>${fmtDate(r.date)}</td>
            <td>${fmtRp(r.dana)}</td>
            <td>${r.dividen ? fmtRp(r.dividen) : '—'}</td>
            <td>${fmtRp(r.equity)}</td>
            <td>${fmtRp(r.nab)}</td>
            <td style="color:${r.nabPct>=0?'var(--gain)':'var(--loss)'}">${fmtPct(r.nabPct)}</td>
            <td>${r.ihsg}</td>
            <td><span class="edit-btn" onclick="startEdit('${r.id}')">Ubah</span><span class="delete-btn" onclick="deleteEntry('${r.id}')">Hapus</span></td>
          </tr>
        `).join('')}
        </tbody>
      </table>
      </div>
      ` : `<div class="empty">Belum ada entri.</div>`}
    </div>
  `;

  // Total Beli Auto-Calc
  const lotInp = document.getElementById('t-lot'), hrgInp = document.getElementById('t-harga'), totInp = document.getElementById('t-total');
  function calcTotal(){ totInp.value = Math.round((parseFloat(lotInp.value)||0) * 100 * (parseFloat(hrgInp.value)||0)); }
  if(lotInp && hrgInp){ lotInp.addEventListener('input', calcTotal); hrgInp.addEventListener('input', calcTotal); calcTotal(); }

  // Auto fill Equity
  document.getElementById('btn-use-synced-equity').addEventListener('click', ()=>{
    document.getElementById('f-equity').value = Math.round(summary.totalEquity);
  });

  document.getElementById('form-transaction').addEventListener('submit', e=>{
    e.preventDefault();
    const type = document.getElementById('t-type').value;
    const kode = document.getElementById('t-kode').value.toUpperCase().trim();
    const date = document.getElementById('t-date').value;
    const lembar = (parseFloat(document.getElementById('t-lot').value) || 0) * 100;
    const harga = parseFloat(document.getElementById('t-harga').value) || 0;

    if(!kode || !date || lembar<=0 || harga<=0) return;

    if(editingTxId){
      const idx = transactions.findIndex(t=>t.id===editingTxId);
      transactions[idx] = { id: editingTxId, date, type, kode, lembar, harga, total: lembar*harga };
      editingTxId = null;
    } else {
      transactions.push({ id:'tx_'+Date.now(), date, type, kode, lembar, harga, total: lembar*harga });
    }
    saveTransactions(); renderAll();
  });

  document.getElementById('form-entry').addEventListener('submit', e=>{
    e.preventDefault();
    const date = document.getElementById('f-date').value;
    const dana = parseFloat(document.getElementById('f-dana').value)||0;
    const dividen = parseFloat(document.getElementById('f-dividen').value)||0;
    const equity = parseFloat(document.getElementById('f-equity').value);
    const ihsg = parseFloat(document.getElementById('f-ihsg').value);

    if(!date || isNaN(equity) || isNaN(ihsg)) return;

    if(editingId){
      const idx = rows.findIndex(r=>r.id===editingId);
      rows[idx] = {...rows[idx], date, dana, dividen, equity, ihsg};
      editingId = null;
    } else {
      rows.push({id:'e_'+Date.now(), date, dana, dividen, equity, ihsg});
    }
    saveData(); renderAll();
  });
}

function startEdit(id){ editingId = id; renderData(); }
function deleteEntry(id){ if(confirm('Hapus entri?')){ rows = rows.filter(r=>r.id!==id); saveData(); renderAll(); } }
function startTxEdit(id){ editingTxId = id; renderData(); }
function deleteTxEntry(id){ if(confirm('Hapus transaksi?')){ transactions = transactions.filter(t=>t.id!==id); saveTransactions(); renderAll(); } }

function renderWatchlist(){
  const el = document.getElementById('view-watchlist');
  el.innerHTML = `<div class="card"><h2>Watchlist</h2><p class="desc">Kelola kriteria saham dan pembaruan harga.</p></div>`;
}
function renderPengaturan(){
  const el = document.getElementById('view-pengaturan');
  el.innerHTML = `<div class="card"><h2>Pengaturan</h2></div>`;
}
function renderSyncStatus(){ const el = document.getElementById('sync-status'); if(el) el.textContent = syncStatus.message; }

function renderAll(){ renderRingkasan(); renderData(); renderWatchlist(); renderPengaturan(); }

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('view-' + t.dataset.tab).classList.add('active');
  });
});

window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
